<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Wheel of Wisdom – iPad App Store screenshots</title>
<!--
  iPad App Store screenshot template (2064 × 2752, iPad 13" display).
  Open with ?slide=1 … ?slide=5 and capture the viewport at exactly 2064 × 2752.
  Screens in captures/ipad/ are the web app rendered at an iPad 13" viewport (1032 × 1376 @2x).
  See assets/app-store/metadata.md for the render command.
-->
<style>
  @font-face { font-family: Outfit; src: url('../../src/fonts/outfit-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'DM Sans'; src: url('../../src/fonts/dm-sans-latin-wght-normal.woff2') format('woff2'); font-weight: 100 1000; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 2064px; height: 2752px; overflow: hidden; }
  body { font-family: 'DM Sans', sans-serif; -webkit-font-smoothing: antialiased; }

  .slide { position: relative; width: 2064px; height: 2752px; overflow: hidden; background: var(--bg); color: var(--fg); }
  .slide::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 30px; background: linear-gradient(90deg, #bf482d, #e7ab65 35%, #a8cdbb 70%, #284b3b); z-index: 5; }

  .theme-green  { --bg: radial-gradient(120% 70% at 50% 0%, #34604c 0%, #284b3b 55%, #1d382c 100%); --fg: #f8f6ef; --accent: #f1c27d; --sub: #cfe0d4; }
  .theme-orange { --bg: radial-gradient(120% 70% at 50% 0%, #d65f40 0%, #bf482d 55%, #9c3922 100%); --fg: #fff9e9; --accent: #283f34; --sub: #ffe3d2; }
  .theme-cream  { --bg: radial-gradient(120% 70% at 50% 0%, #fffdf6 0%, #f8f6ef 55%, #efeadb 100%); --fg: #283f34; --accent: #bf482d; --sub: #5d6a5f; }

  .copy { position: absolute; top: 190px; left: 0; right: 0; text-align: center; padding: 0 160px; z-index: 4; }
  .eyebrow { display: inline-flex; align-items: center; gap: 24px; font-weight: 700; font-size: 50px; letter-spacing: 12px; text-transform: uppercase; color: var(--accent); }
  h1 { font-family: Outfit, sans-serif; font-weight: 700; font-size: 176px; line-height: .98; letter-spacing: -5px; margin-top: 44px; }
  h1 em { font-style: normal; color: var(--accent); }
  .sub { margin: 48px auto 0; max-width: 1500px; font-size: 62px; line-height: 1.35; color: var(--sub); font-weight: 500; }

  .tablet { position: absolute; left: 50%; top: 1010px; width: 1560px; transform: translateX(-50%); z-index: 3;
            padding: 44px; border-radius: 110px; background: linear-gradient(145deg, #3c4a43, #11181a 40%, #2b3833); box-shadow: 0 80px 160px #0006, 0 0 0 5px #5b6b62 inset; }
  .screen { position: relative; border-radius: 70px; overflow: hidden; aspect-ratio: 3 / 4; background: #f8f6ef; }
  .screen img { display: block; width: 100%; height: 100%; }
  .statusbar { position: absolute; top: 0; left: 0; right: 0; height: 34px; display: flex; align-items: center; justify-content: space-between; padding: 6px 46px 0; color: #111; font-weight: 700; font-size: 22px; }
  .statusbar .date { font-weight: 600; }
  .status-icons { display: flex; gap: 10px; align-items: center; }
  .status-icons svg { height: 18px; }

  .deco-wheel { position: absolute; z-index: 1; }
  .sparkle { position: absolute; z-index: 2; color: var(--accent); }
  .badge { position: absolute; z-index: 6; width: 330px; height: 330px; border-radius: 50%; display: grid; place-items: center; text-align: center;
           background: #f1e7a6; color: #283f34; font-family: Outfit, sans-serif; font-weight: 800; font-size: 44px; line-height: 1.12; letter-spacing: 2px; text-transform: uppercase;
           box-shadow: 0 24px 50px #0003, 0 0 0 12px #f8f6ef88; transform: rotate(var(--rot, 8deg)); }
  .badge small { display: block; font-size: 78px; letter-spacing: -1px; }
</style>
</head>
<body>
<div id="root"></div>

<template id="tablet-tpl">
  <div class="tablet">
    <div class="screen">
      <img alt="" />
      <div class="statusbar">
        <span>9:41 <span class="date">Mon Oct 5</span></span>
        <span class="status-icons">
          <svg viewBox="0 0 48 34" fill="#111"><path d="M24 34l-7-8a10 10 0 0114 0z"/><path d="M24 15a19 19 0 0113.5 5.6l-4 4.4a13 13 0 00-19 0l-4-4.4A19 19 0 0124 15z"/><path d="M24 0a35 35 0 0124 9.6l-4 4.4a29 29 0 00-40 0l-4-4.4A35 35 0 0124 0z"/></svg>
          <span>100%</span>
          <svg viewBox="0 0 80 36"><rect x="2" y="2" width="68" height="32" rx="10" fill="none" stroke="#111" stroke-width="3" opacity=".45"/><rect x="7" y="7" width="58" height="22" rx="6" fill="#111"/><rect x="73" y="12" width="5" height="12" rx="2.5" fill="#111" opacity=".45"/></svg>
        </span>
      </div>
    </div>
  </div>
</template>

<script src="art.js"></script>
<script>
  const slides = {
    1: {
      theme: 'green', shot: 'captures/ipad/lobby.png',
      eyebrow: 'Pass &amp; play', title: 'Game night,<br><em>big-screen style.</em>',
      sub: 'Spin the wheel and solve word puzzles with 2–3 friends on one iPad.',
      wheels: [{ size: 1700, left: -760, top: 1500, opacity: .18 }, { size: 1100, left: 1560, top: 620, opacity: .12 }],
      badge: { html: '<div><small>2–3</small>players<br>one iPad</div>', left: 1700, top: 1900, rot: '10deg' },
    },
    2: {
      theme: 'orange', shot: 'captures/ipad/spinning.png',
      eyebrow: 'Round and round', title: 'Spin it.<br><em>Win it.</em>',
      sub: 'Cash wedges, surprise trips, mystery prizes… and the dreaded Bankrupt.',
      wheels: [{ size: 1800, left: 900, top: 1450, opacity: .2 }],
      badge: { html: '<div>Bigger<br>wheel<br>every<br>round</div>', left: 30, top: 2150, rot: '-9deg' },
    },
    3: {
      theme: 'cream', shot: 'captures/ipad/board.png',
      eyebrow: 'Your turn!', title: 'Pass it around.<br><em>Beat the clock.</em>',
      sub: 'A 30-second turn timer keeps the game moving and everyone on their toes.',
      wheels: [{ size: 1700, left: -860, top: 1350, opacity: .14 }, { size: 1200, left: 1500, top: 2050, opacity: .12 }],
      badge: { html: '<div><small>30s</small>turn<br>clock</div>', left: 1700, top: 1250, rot: '8deg' },
    },
    4: {
      theme: 'green', shot: 'captures/ipad/celebrate.png',
      eyebrow: 'Four rounds + a bonus', title: 'Big words.<br><em>Bigger wins.</em>',
      sub: 'Solve the board, bank the cash, then go for the $100,000 mystery envelope.',
      wheels: [{ size: 1600, left: 1100, top: 1700, opacity: .16 }, { size: 1000, left: -560, top: 700, opacity: .12 }],
      badge: { html: '<div>Confetti<br>for every<br>solve</div>', left: 30, top: 1700, rot: '-8deg' },
    },
    5: {
      theme: 'orange', shot: 'captures/ipad/history.png',
      eyebrow: 'Hall of fame', title: 'Every game night,<br><em>remembered.</em>',
      sub: 'Leaderboard and history stay private on your device. No accounts. Works offline.',
      wheels: [{ size: 1700, left: -800, top: 1600, opacity: .18 }],
      badge: { html: '<div><small>600</small>original<br>puzzles</div>', left: 1700, top: 2000, rot: '9deg' },
    },
  };

  const n = Number(new URLSearchParams(location.search).get('slide') || 1);
  const s = slides[n] || slides[1];
  const slide = document.createElement('section');
  slide.className = `slide theme-${s.theme}`;
  slide.innerHTML = `
    <div class="copy">
      <div class="eyebrow">${sparkSvg(46)}<span>${s.eyebrow}</span>${sparkSvg(46)}</div>
      <h1>${s.title}</h1>
      <p class="sub">${s.sub}</p>
    </div>`;

  for (const w of s.wheels) {
    const d = document.createElement('div');
    d.className = 'deco-wheel';
    Object.assign(d.style, { left: `${w.left}px`, top: `${w.top}px`, opacity: w.opacity });
    d.innerHTML = wheelSvg(w.size, { labels: false, hub: false });
    slide.append(d);
  }

  [[110, 420, 84], [1880, 760, 64], [80, 900, 52], [1900, 1180, 92]].forEach(([x, y, size], i) => {
    const sp = document.createElement('div');
    sp.className = 'sparkle';
    Object.assign(sp.style, { left: `${x}px`, top: `${y}px`, opacity: i % 2 ? .55 : .85 });
    sp.innerHTML = sparkSvg(size);
    slide.append(sp);
  });

  const tablet = document.getElementById('tablet-tpl').content.firstElementChild.cloneNode(true);
  tablet.querySelector('img').src = s.shot;
  slide.append(tablet);

  const b = document.createElement('div');
  b.className = 'badge';
  b.innerHTML = s.badge.html;
  Object.assign(b.style, { left: `${s.badge.left}px`, top: `${s.badge.top}px` });
  b.style.setProperty('--rot', s.badge.rot);
  slide.append(b);

  document.getElementById('root').append(slide);
</script>
</body>
</html>
