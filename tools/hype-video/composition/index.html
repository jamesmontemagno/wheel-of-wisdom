<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wheel of Wisdom launch video</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="viewport">
    <main id="stage">
      <canvas id="background" width="1920" height="1080"></canvas>
      <div id="scenes"></div>
      <div id="flash"></div>
      <div id="vignette"></div>
      <div id="fade"></div>
    </main>
  </div>
  <div id="controls" hidden>
    <button id="play">Play</button>
    <input id="scrub" type="range" min="0" step="0.01" value="0">
    <output id="time">0.00s</output>
    <audio id="music"></audio>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
